<p>寒假本来就应该结束了，但是现在延长了，不过学校布置的学习任务也越来越重了。为了尽快做好过渡期的学习生活工作，我从现在开始转为半周更，开学之后转为周更吧。</p>
<p>再说反正也没有人看，日更也没啥意思，那就周更吧。</p>
